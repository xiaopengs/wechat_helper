  modes_title:                    "它不只聊天,还能定时跑"
  modes_subtitle:                 "同一套桌面应用,两种完全不同的用法。"
  modes_note:                     "API key 存在本地 secret store,数据外发范围由你定。"
  modes_footer_source_suffix:     "#scheduled-mode"
  compare_title:                  "别问谁最好,先看你的场景"
  compare_subtitle:               "桌面/云端/协作/工程,四种路径解决不同问题。"
  howto_title:                    "4 步上手：下载桌面端 → 接模型 → 描述 → 审批"
  howto_subtitle:                 "前置：macOS 12+ 或 Windows 10/11,准备好 API key 或本地 Ollama。"
  howto_footer_source_suffix:     "openworker.com/download"
  captions: |
    ## 总导语（公众号「图片·文字」首图说明）

    你有没有发现，AI 聊天助手很溜，但真要做实事还是得人跑——开会、整理收件箱、写周报、回 Slack，流程一长就掉链子。

    Andrew Ng 团队（deeplearning.ai / Coursera 创始人）最新开源 **OpenWorker**，13 天拿下 11.8k stars。它跑在你桌面上，你告诉它想要什么结果，它就在桌面/文件/25+ 应用里执行，写/发/跑命令前停下让你审批。文档、表格、网页，落盘为本地文件，不是又一个聊天窗口。

    最大特点：**本地优先 + 模型无关**。OpenAI、Anthropic、Gemini、Ollama 任意切，BYO API key，不锁模型。技术栈 Python（aisuite 引擎）+ TypeScript（UI）+ Rust（原生壳），跨 macOS 和 Windows。

    下面 6 张图把痛点、流水线、双模式、相对 Manus / Claude Cowork / Devin 的差异、上手节奏都拆给你看。
    ⭐ 11,808 Stars*、MIT 开源、v0.1.0 Beta · macOS 已签名公证，Windows 签名进行中。

    ---

    ## P1 ｜封面
    > 你桌面上的 AI 同事，不是又一个聊天窗口。
    封面一句话：**OpenWorker = 真交付 + 本地 + BYO 模型**。
    Python + TS + Rust 跨端、MIT 开源、v0.1.0、11,808 Stars*。

    ## P2 ｜痛点
    > 聊天 ≠ 干活。聊天助手给方案、真正执行要人跟；工具割裂串不起；云端依赖有合规风险。
    OpenWorker 把「真做实事」接进 AI 同事：目标 → 拆解 → 审批 → 交付。

    ## P3 ｜优势 / 流水线
    > 4 步流水线：目标 → 拆解 → 审批 → 交付。4 大护城河：Python+TS+Rust 跨端、模型无关、25+ 工具、审批可控。
    聊天助手遍地；难的是交付成品 + 落地在本地。

    ## P4 ｜双模式
    > DESKTOP MODE 桌面交互 vs SCHEDULED MODE 定时自动化。
    同一套 aisuite 引擎 + 25+ 连接器 + BYO 模型，两条完全不同的生产线。

    ## P5 ｜竞品
    > 别问谁最好，先看你的场景。vs Manus（云端异步）/ Claude Cowork（文档协作）/ Devin（软件工程）。
    OpenWorker 的相对优势：桌面 + 真交付 + 本地优先 + BYO 模型。

    ## P6 ｜上手
    > 4 步上手：下载桌面端 → 接模型 → 描述目标 → 审批放行。
    3 条建议：从小事起 / 看 transcript / 严审批。Beta 版本 Windows 未签名，SmartScreen 会拦；模型 API 有 token 成本与数据外发范围。

