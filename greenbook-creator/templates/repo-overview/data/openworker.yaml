  pain_footer_source_suffix:      "docs/how-it-works.md"
  advantage_title:                "真护城河：不是 AI 助手,是 AI 同事"
  advantage_subtitle:             "聊天助手遍地；难的是交付成品 + 落地在本地。"
  advantage_closing:              "{name} 把「聊天 AI 助手」升级为「真做实事的同事」。"
