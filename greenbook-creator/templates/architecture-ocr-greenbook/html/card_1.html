<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Card 1 · 封面 · OCR Review</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="label-tag blue">
        <span class="dot"></span>
        <span>OPEN CODE REVIEW · 架构拆解</span>
      </div>
      <div class="page-num">01 / 08</div>
    </div>

    <div style="margin-top: 12px; margin-bottom: 28px;">
      <h1 class="title">给 AI 写一份<br>
        <span class="hl">可拆解的代码评审流水线</span>
      </h1>
      <p class="subtitle">OCR Review · 6 阶段流水线 · 分节提取协议 ｜ 截断问题的根因解药</p>
    </div>

    <div style="position: relative; margin-bottom: 36px;">
      <div style="display:flex;justify-content:center;margin-bottom:32px;">
        <div class="central-node">
          <div class="label">ocr-review</div>
          <div class="desc">代码评审流水线 · 8 节拆解</div>
        </div>
      </div>

      <div class="grid-4">
        <div class="side-node green">
          <div class="lab">BOOTSTRAP</div>
          <div class="sub">启动装配</div>
        </div>
        <div class="side-node blue">
          <div class="lab">DIFF READ</div>
          <div class="sub">Git 变更</div>
        </div>
        <div class="side-node purple">
          <div class="lab">FILTER</div>
          <div class="sub">过滤规则</div>
        </div>
        <div class="side-node orange">
          <div class="lab">OUTPUT</div>
          <div class="sub">三件套</div>
        </div>
      </div>
    </div>

    <div class="row" style="margin-bottom: 18px;">
      <div class="chip green">分节提取</div>
      <div class="chip blue">无截断</div>
      <div class="chip purple">可重试</div>
    </div>

    <div class="closing">
      <span class="dot"></span>
      <span class="text"><b>原图描述卡在 "≥50 lines"</b> → 本方案 6 节字段全部完整 ✓</span>
    </div>

    <div class="footer">
      <div class="source">来源：架构图（Open Code Review 实现架构）</div>
      <div class="label"><span class="icon"></span>OCR Review 架构拆解 · 2026.08</div>
    </div>
  </div>
</body>
</html>
