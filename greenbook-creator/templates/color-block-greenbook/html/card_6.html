<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 办公 Agent</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="deco deco-circle"></div>
  <div class="card">
    <div class="header">
      <div class="label-tag">办公 Agent</div>
      <div class="page-num"><strong>06</strong> / 10</div>
    </div>

    <h1 class="title title-sm">不是所有 Agent<br><span class="hl">都应该拿来和编程工具比</span></h1>

    <div class="grid-2" style="margin-bottom: 26px;">
      <div class="tool-box t-green">
        <div class="tool-name">WorkBuddy <span class="tool-co">腾讯</span></div>
        <div class="tool-desc">更像<b>个人工作 Agent</b>，适合办公场景。</div>
      </div>
      <div class="tool-box t-orange">
        <div class="tool-name">Marvis <span class="tool-co">腾讯</span></div>
        <div class="tool-desc">适合放在<b>办公自动化候选</b>里，用真实工作流测试。</div>
      </div>
    </div>

    <div class="section-label">典型办公场景</div>

    <div class="check-list">
      <div class="check-item"><span class="check-mark">✓</span>整理资料</div>
      <div class="check-item"><span class="check-mark">✓</span>写文案 / 总结</div>
      <div class="check-item"><span class="check-mark">✓</span>处理表格 / 数据分析</div>
      <div class="check-item"><span class="check-mark">✓</span>自动执行重复任务</div>
    </div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 铁爪爪Ai</div>
    </div>
  </div>
</body>
</html>
