<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 日常提效</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="label-tag">研发日常提效</div>
      <div class="page-num"><strong>05</strong> / 10</div>
    </div>

    <h1 class="title title-sm">不一定要全自动<br><span class="hl">日常高频也很重要</span></h1>

    <div class="grid-2" style="margin-bottom: 26px;">
      <div class="tool-box t-blue">
        <div class="tool-name">Baidu Comate <span class="tool-co">百度</span></div>
        <div class="tool-desc">代码补全、智能问答、代码解释、<b>单测生成</b>、研发提效。</div>
      </div>
      <div class="tool-box t-sand">
        <div class="tool-name">ZCode <span class="tool-co">智谱</span></div>
        <div class="tool-desc">适合放进国产 AI 编程助手<b>候选池做对比测试</b>。</div>
      </div>
    </div>

    <div class="conclusion" style="margin-bottom: 16px;">很多时候，你不需要 AI 一口气写完整个项目。能帮你<span class="accent">读懂老代码、修报错、补单测</span>，就已经很值。</div>

    <div class="block block-white">
      <div class="block-title">适合谁</div>
      <div class="block-sub">每天写业务代码、读旧项目、查问题的研发同学。</div>
    </div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 小克碎碎谈</div>
    </div>
  </div>
</body>
</html>
