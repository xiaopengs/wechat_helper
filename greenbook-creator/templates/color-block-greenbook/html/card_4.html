<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 编程主力候选</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="deco deco-tl2"></div>
  <div class="card">
    <div class="header">
      <div class="label-tag">编程主力候选</div>
      <div class="page-num"><strong>04</strong> / 10</div>
    </div>

    <h1 class="title title-sm">想让 AI 改代码<br><span class="hl">先看这 3 个</span></h1>

    <div class="col" style="margin-bottom: 26px;">
      <div class="tool-box t-yellow">
        <div class="tool-name">Trae <span class="tool-co">字节跳动</span></div>
        <div class="tool-desc">更像 <b>AI IDE</b>。适合前端页面、小工具、项目改造、Vibe Coding 入门。</div>
      </div>
      <div class="tool-box t-teal">
        <div class="tool-name">CodeBuddy <span class="tool-co">腾讯云</span></div>
        <div class="tool-desc"><b>全链路开发感更强</b>。从需求、设计、编码到部署都能参与，适合业务原型和活动页。</div>
      </div>
      <div class="tool-box t-purple">
        <div class="tool-name">Qoder <span class="tool-co">阿里</span></div>
        <div class="tool-desc">适合测 <b>agentic coding</b>。可以作为「AI 接手更大开发任务」的候选工具来试。</div>
      </div>
    </div>

    <div class="conclusion">如果你的目标是「让 AI 真正参与项目」，<span class="accent">这页优先收藏</span>。</div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 小克碎碎谈</div>
    </div>
  </div>
</body>
</html>
