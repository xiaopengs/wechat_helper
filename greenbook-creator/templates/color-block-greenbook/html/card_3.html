<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 公司背景</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="label-tag">公司背景速览</div>
      <div class="page-num"><strong>03</strong> / 10</div>
    </div>

    <h1 class="title title-sm">先看一眼<br><span class="hl">这 10 个分别是谁家的</span></h1>

    <div class="col" style="margin-bottom: 26px;">
      <div class="pair-row"><span class="pair-name">WorkBuddy</span><span class="pair-co">腾讯</span></div>
      <div class="pair-row"><span class="pair-name">QClaw</span><span class="pair-co">腾讯</span></div>
      <div class="pair-row"><span class="pair-name">Trae</span><span class="pair-co">字节跳动</span></div>
      <div class="pair-row"><span class="pair-name">扣子</span><span class="pair-co">字节跳动</span></div>
      <div class="pair-row"><span class="pair-name">扣子编程</span><span class="pair-co">字节跳动</span></div>
      <div class="pair-row"><span class="pair-name">Qoder</span><span class="pair-co">阿里</span></div>
      <div class="pair-row"><span class="pair-name">CodeBuddy</span><span class="pair-co">腾讯云</span></div>
      <div class="pair-row"><span class="pair-name">Baidu Comate</span><span class="pair-co">百度</span></div>
      <div class="pair-row"><span class="pair-name">ZCode</span><span class="pair-co">智谱</span></div>
      <div class="pair-row"><span class="pair-name">Marvis</span><span class="pair-co">腾讯</span></div>
    </div>

    <div class="conclusion">选工具时，公司背景只能做参考，真正要看的是：<span class="accent">你的任务能不能稳定跑完</span>。</div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 小克碎碎谈</div>
    </div>
  </div>
</body>
</html>
