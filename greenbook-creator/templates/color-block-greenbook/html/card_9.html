<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 选择建议</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="deco deco-circle"></div>
  <div class="card">
    <div class="header">
      <div class="label-tag">选择建议</div>
      <div class="page-num"><strong>09</strong> / 10</div>
    </div>

    <h1 class="title title-sm">按你的工作来选<br><span class="hl">不要按热度来选</span></h1>

    <div class="col" style="margin-bottom: 26px;">
      <div class="pick-row"><span class="pick-scene">AI 编程主力</span><span class="pick-tools"><span class="pick-chip">Trae</span><span class="pick-chip">CodeBuddy</span><span class="pick-chip">Qoder</span></span></div>
      <div class="pick-row"><span class="pick-scene">日常研发提效</span><span class="pick-tools"><span class="pick-chip">Baidu Comate</span><span class="pick-chip">ZCode</span></span></div>
      <div class="pick-row"><span class="pick-scene">办公自动化</span><span class="pick-tools"><span class="pick-chip">WorkBuddy</span><span class="pick-chip">Marvis</span></span></div>
      <div class="pick-row"><span class="pick-scene">智能体应用</span><span class="pick-tools"><span class="pick-chip">扣子</span><span class="pick-chip">扣子编程</span></span></div>
      <div class="pick-row"><span class="pick-scene">国内版 OpenClaw</span><span class="pick-tools"><span class="pick-chip">QClaw</span></span></div>
    </div>

    <div class="conclusion">新手建议：先做一个小页面，再搭一个工作流，<span class="accent">最后处理一个真实办公任务</span>。</div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 小克碎碎谈</div>
    </div>
  </div>
</body>
</html>
