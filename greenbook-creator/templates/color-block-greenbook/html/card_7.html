<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 平台型 Agent</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="label-tag">平台型 Agent</div>
      <div class="page-num"><strong>07</strong> / 10</div>
    </div>

    <h1 class="title title-sm">想搭一个能用的<br><span class="hl">Agent 应用看扣子</span></h1>

    <div class="grid-2" style="margin-bottom: 24px;">
      <div class="tool-box t-pink">
        <div class="tool-name">扣子 <span class="tool-co">字节跳动</span></div>
        <div class="tool-desc">智能体、<b>工作流</b>、插件调用、知识库问答。</div>
      </div>
      <div class="tool-box t-red">
        <div class="tool-name">扣子编程 <span class="tool-co">字节跳动</span></div>
        <div class="tool-desc">更偏<b>应用搭建、智能体和写代码结合</b>。</div>
      </div>
    </div>

    <div class="block block-yellow" style="margin-bottom: 16px;">
      <div class="block-title">适合做</div>
      <div class="block-sub">客服机器人 / 内容工作流 / AI 小应用</div>
    </div>

    <div class="block block-ink">
      <div class="block-title">关键点</div>
      <div class="block-sub">不是单纯编辑器，而是搭 Agent 应用的工作台。把多个工具串起来，知识库、插件、流程和对话都能变成一个可用应用。</div>
    </div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 铁爪爪Ai</div>
    </div>
  </div>
</body>
</html>
