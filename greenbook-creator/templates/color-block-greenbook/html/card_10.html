<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 最后提醒</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="deco deco-tl"></div>
  <div class="card">
    <div class="header">
      <div class="label-tag">最后提醒</div>
      <div class="page-num"><strong>10</strong> / 10</div>
    </div>

    <h1 class="title title-sm">别神化<br><span class="hl">也别低估</span></h1>

    <div class="check-list" style="margin-bottom: 30px;">
      <div class="check-item"><span class="check-mark">✓</span>小项目可以多让 AI 做</div>
      <div class="check-item"><span class="check-mark">✓</span>大项目先让 AI 改局部</div>
      <div class="check-item"><span class="check-mark">✓</span>每次都要看 diff</div>
      <div class="check-item"><span class="check-mark">✓</span>关键路径自己验收</div>
      <div class="check-item"><span class="check-mark">✓</span>能跑测试就跑测试</div>
    </div>

    <div class="quote">AI Agent 不是魔法按钮。<br>它更像一个<b>速度很快、但需要你会验收的实习生</b>。</div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 铁爪爪Ai</div>
    </div>
  </div>
</body>
</html>
