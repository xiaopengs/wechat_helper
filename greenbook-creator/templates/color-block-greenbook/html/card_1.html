<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 封面</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="deco deco-tl"></div>
  <div class="card">
    <div class="header">
      <div class="label-tag">国内 Agent 选择清单</div>
      <div class="page-num"><strong>01</strong> / 10</div>
    </div>

    <h1 class="title">推荐 10 个<br><span class="hl">Codex 国产平替</span></h1>

    <p class="subtitle">Claude Code / Codex 好用，但不一定好开始。</p>

    <div class="intro">国外 Agent 常卡在访问、账号、费用和门槛。先用国内工具跑起来，反而更现实。</div>

    <div class="section-label">10 个 Codex 平替清单</div>

    <div class="tag-grid" style="margin-bottom: 30px;">
      <span class="tag yellow"><span class="idx">01</span>WorkBuddy</span>
      <span class="tag sand"><span class="idx">02</span>QClaw</span>
      <span class="tag green"><span class="idx">03</span>Trae</span>
      <span class="tag teal"><span class="idx">04</span>扣子</span>
      <span class="tag blue"><span class="idx">05</span>扣子编程</span>
      <span class="tag purple"><span class="idx">06</span>Qoder</span>
      <span class="tag pink"><span class="idx">07</span>CodeBuddy</span>
      <span class="tag orange"><span class="idx">08</span>Comate</span>
      <span class="tag red"><span class="idx">09</span>ZCode</span>
      <span class="tag gray"><span class="idx">10</span>Marvis</span>
    </div>

    <div class="conclusion">为什么要找平替：<span class="accent">访问限制 / 账号订阅 / 模型费用 / 使用门槛</span></div>

    <div class="footer">
      <div class="tagline">先跑起来，比什么都强。</div>
      <div class="watermark"><span class="watermark-icon">✎</span> 小克碎碎谈</div>
    </div>
  </div>
</body>
</html>
