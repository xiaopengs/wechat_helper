<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>色块模板 · 痛点 2×2</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="deco deco-circle"></div>
  <div class="card">
    <div class="header">
      <div class="label-tag">为什么要找国内平替</div>
      <div class="page-num"><strong>02</strong> / 10</div>
    </div>

    <h1 class="title">国外工具强<br><span class="hl">但这 4 件事真绕不开</span></h1>

    <div class="grid-2x2" style="margin-bottom: 28px;">
      <div class="block block-yellow">
        <div class="block-title"><span class="block-num">1</span>访问限制不稳定</div>
        <div class="block-sub">今天能用，明天可能又要重新折腾。</div>
      </div>
      <div class="block block-sand">
        <div class="block-title"><span class="block-num">2</span>账号订阅麻烦</div>
        <div class="block-sub">注册、登录、支付，经常先卡在门口。</div>
      </div>
      <div class="block block-green">
        <div class="block-title"><span class="block-num">3</span>模型费用不低</div>
        <div class="block-sub">高频写代码、跑 Agent，成本会很快上来。</div>
      </div>
      <div class="block block-purple">
        <div class="block-title"><span class="block-num">4</span>使用门槛偏高</div>
        <div class="block-sub">英文文档、命令行、环境配置，对新手不友好。</div>
      </div>
    </div>

    <div class="conclusion">找国内平替，不是因为国外工具不好，而是你需要一个<span class="accent">更容易开始、能长期稳定使用</span>的工具。</div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">✎</span> 铁爪爪Ai</div>
    </div>
  </div>
</body>
</html>
