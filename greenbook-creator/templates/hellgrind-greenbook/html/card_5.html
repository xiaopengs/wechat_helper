<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Hell Grind · 对比表</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="label-tag orange">VS OTHERS · 对比优势</div>
      <div class="page-num"><strong>05</strong> / 08</div>
    </div>

    <div class="chip orange">横评</div>

    <h1 class="title title-sm">vs 真人电影 & AI 短片<br><span class="hl">"80 分钟完整长片"是分水岭</span></h1>

    <p class="subtitle">从时长、制作方式、开源程度三个维度看 AI 电影走到哪一步了。</p>

    <!-- 对比表 -->
    <div class="banner">
      <div class="banner-label">DIMENSIONS · 对比维度</div>
      <table style="width:100%;border-collapse:separate;border-spacing:8px;">
        <thead>
          <tr>
            <th style="font-family:'JetBrains Mono',monospace;font-size:20px;text-align:left;padding:8px 12px;">维度</th>
            <th style="font-family:'JetBrains Mono',monospace;font-size:20px;text-align:center;padding:8px 12px;">真人电影</th>
            <th style="font-family:'JetBrains Mono',monospace;font-size:20px;text-align:center;padding:8px 12px;">AI 短视频</th>
            <th style="font-family:'JetBrains Mono',monospace;font-size:20px;text-align:center;padding:8px 12px;background:var(--green);border:3px solid #111;border-radius:12px;">Hell Grind</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="compare-cell" style="text-align:left;"><div class="compare-label" style="font-size:18px;">片长</div></td>
            <td class="compare-cell"><div class="check">✓</div></td>
            <td class="compare-cell"><div class="cross">✗</div></td>
            <td class="compare-cell" style="background:var(--green);"><div class="check">✓</div></td>
          </tr>
          <tr>
            <td class="compare-cell" style="text-align:left;"><div class="compare-label" style="font-size:18px;">无真人实拍</div></td>
            <td class="compare-cell"><div class="cross">✗</div></td>
            <td class="compare-cell"><div class="check">✓</div></td>
            <td class="compare-cell" style="background:var(--green);"><div class="check">✓</div></td>
          </tr>
          <tr>
            <td class="compare-cell" style="text-align:left;"><div class="compare-label" style="font-size:18px;">制作素材开源</div></td>
            <td class="compare-cell"><div class="cross">✗</div></td>
            <td class="compare-cell"><div class="warn">⚠</div></td>
            <td class="compare-cell" style="background:var(--green);"><div class="check">✓</div></td>
          </tr>
          <tr>
            <td class="compare-cell" style="text-align:left;"><div class="compare-label" style="font-size:18px;">可自行复刻</div></td>
            <td class="compare-cell"><div class="cross">✗</div></td>
            <td class="compare-cell"><div class="warn">⚠</div></td>
            <td class="compare-cell" style="background:var(--green);"><div class="check">✓</div></td>
          </tr>
          <tr>
            <td class="compare-cell" style="text-align:left;"><div class="compare-label" style="font-size:18px;">戛纳首映</div></td>
            <td class="compare-cell"><div class="check">✓</div></td>
            <td class="compare-cell"><div class="cross">✗</div></td>
            <td class="compare-cell" style="background:var(--green);"><div class="check">✓</div></td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 总结条 -->
    <div class="banner" style="background: var(--ylight);margin-top:14px;">
      <div class="banner-label">VERDICT · 一句话结论</div>
      <div class="tagline">Hell Grind 是目前<span class="accent">唯一</span>同时做到「长片 + 全 AI + 全开源」的案例。</div>
    </div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">💬</span> 铁爪爪Ai</div>
    </div>
  </div>
</body>
</html>
