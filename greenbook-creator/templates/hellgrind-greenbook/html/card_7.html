<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Hell Grind · 适用 vs 不适用</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="label-tag pink">USE CASES · 适用 vs 不适用</div>
      <div class="page-num"><strong>07</strong> / 08</div>
    </div>

    <div class="chip pink">决策树</div>

    <h1 class="title title-sm">你是<br><span class="hl">哪种观众 / 哪种创作者</span>吗</h1>

    <p class="subtitle">《Hell Grind》值得看、值得拆，但要看你是哪种人——它的用法边界很清楚。</p>

    <!-- 双列 · yes / no -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">
      <div class="yes-col">
        <div class="col-head yes"><span class="badge">✓</span> 适用</div>
        <div class="list-item yes"><span class="marker">●</span>想追 AI 电影前沿的影迷</div>
        <div class="list-item yes"><span class="marker">●</span>想学 AI 长片分镜工作流</div>
        <div class="list-item yes"><span class="marker">●</span>想用 Seedance 2.0 复刻片段</div>
        <div class="list-item yes"><span class="marker">●</span>暗黑朋克题材爱好者</div>
      </div>
      <div class="no-col">
        <div class="col-head no"><span class="badge">✗</span> 不适用</div>
        <div class="list-item no"><span class="marker">●</span>只想离线存 MP4 收藏</div>
        <div class="list-item no"><span class="marker">●</span>期待传统真人电影质感</div>
        <div class="list-item no"><span class="marker">●</span>想找网盘 / 磁力 / 直链</div>
        <div class="list-item no"><span class="marker">●</span>不接受 AI 生成画面风格</div>
      </div>
    </div>

    <!-- 收尾 -->
    <div class="banner" style="background: var(--ylight);margin-top:18px;">
      <div class="banner-label">VERDICT · 一句话结论</div>
      <div class="tagline">你是 <span class="accent">AI 创作者 / 前沿影迷</span> → <span class="accent">值得看 + 值得拆</span></div>
    </div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">💬</span> 铁爪爪Ai</div>
    </div>
  </div>
</body>
</html>
