<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Card 4 · 5 大特性</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <!-- 模板骨架 · 5 大特性 (card_4)
       结构：label + chip + title + 5 色块 grid + footer
       适合：特性盘点/能力图谱/亮点总结 -->
  <div class="card">
    <div class="header">
      <div class="label-tag purple">KEY FEATURES · 5 大特性</div>
      <div class="page-num"><strong>04</strong> / 08</div>
    </div>

    <div class="chip purple">能力图谱</div>

    <h1 class="title title-sm">TODO · 5 大<span class="hl">核心特性</span></h1>

    <p class="subtitle">TODO · 一句话讲清这些特性解决什么问题</p>

    <!-- 5 色块 · grid-5 -->
    <div class="grid-5" style="margin-bottom: 18px;">
      <div class="block block-pink" style="padding:18px 16px;">
        <div class="block-title-2" style="font-size:24px;">① 特性 A</div>
        <div class="block-sub" style="font-size:18px;">一句话说明</div>
      </div>
      <div class="block block-yellow" style="padding:18px 16px;">
        <div class="block-title-2" style="font-size:24px;">② 特性 B</div>
        <div class="block-sub" style="font-size:18px;">一句话说明</div>
      </div>
      <div class="block block-green" style="padding:18px 16px;">
        <div class="block-title-2" style="font-size:24px;">③ 特性 C</div>
        <div class="block-sub" style="font-size:18px;">一句话说明</div>
      </div>
      <div class="block block-blue" style="padding:18px 16px;">
        <div class="block-title-2" style="font-size:24px;">④ 特性 D</div>
        <div class="block-sub" style="font-size:18px;">一句话说明</div>
      </div>
      <div class="block block-orange" style="padding:18px 16px;">
        <div class="block-title-2" style="font-size:24px;">⑤ 特性 E</div>
        <div class="block-sub" style="font-size:18px;">一句话说明</div>
      </div>
    </div>

    <!-- 收尾 banner · 一句话点睛 -->
    <div class="banner" style="background: var(--ylight);">
      <div class="banner-label">TODO · 总结标语</div>
      <div class="tagline">从 <span class="accent">TODO 旧</span> 升级到 <span class="accent">TODO 新</span>。</div>
    </div>

    <div class="footer">
      <div class="watermark"><span class="watermark-icon">💬</span> 铁爪爪Ai</div>
    </div>
  </div>
</body>
</html>
