<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Card 2 · 5 步工作流</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>
  <!-- 模板骨架 · 5 步工作流 (card_2)
       结构：label + chip + title + subtitle + 5 个 step + footer
       适合：流程说明、SOP、上手路径 -->
  <div class="card">
    <div class="header">
      <div class="label-tag blue">WHAT IT DOES · 一句话定位</div>
      <div class="page-num"><strong>02</strong> / 08</div>
    </div>

    <div class="chip yellow">5 步工作流</div>

    <h1 class="title title-sm">TODO · 它不只补全代码<br><span class="hl">而是从需求到落地</span></h1>

    <p class="subtitle">TODO · 一段说明,讲清楚 5 步的输入/产出</p>

    <!-- 5 步骤 · step block + 箭头 -->
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="block block-pink">
        <div class="step-num">STEP 01 · TODO 标签</div>
        <div class="block-title-2">第一步 · 关键词</div>
        <div class="block-sub">说明文字</div>
      </div>
      <div class="arrow-down"></div>
      <div class="block block-blue">
        <div class="step-num">STEP 02 · TODO 标签</div>
        <div class="block-title-2">第二步 · 关键词</div>
        <div class="block-sub">说明文字</div>
      </div>
      <div class="arrow-down"></div>
      <div class="block block-green">
        <div class="step-num">STEP 03 · TODO 标签</div>
        <div class="block-title-2">第三步 · 关键词</div>
        <div class="block-sub">说明文字</div>
      </div>
      <div class="arrow-down"></div>
      <div class="block block-orange">
        <div class="step-num">STEP 04 · TODO 标签</div>
        <div class="block-title-2">第四步 · 关键词</div>
        <div class="block-sub">说明文字</div>
      </div>
      <div class="arrow-down"></div>
      <div class="block block-purple">
        <div class="step-num">STEP 05 · TODO 标签</div>
        <div class="block-title-2">第五步 · 关键词</div>
        <div class="block-sub">说明文字</div>
      </div>
    </div>

    <div class="footer">
      <div class="tagline"><span class="accent">TODO · 一句话总结</span></div>
      <div class="watermark"><span class="watermark-icon">💬</span> 贴图号 · TODO 品牌</div>
    </div>
  </div>
</body>
</html>
